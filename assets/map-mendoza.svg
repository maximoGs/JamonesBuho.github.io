<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" fill="none">
  <defs>
    <radialGradient id="mapGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#C5A059" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="routeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED798"/>
      <stop offset="100%" stop-color="#8F6A22"/>
    </linearGradient>
    <filter id="shadowNode" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base Map Contour Stylized (Mendoza Oasis & Mountain Foothills) -->
  <rect width="700" height="480" rx="16" fill="#141110" stroke="#2F2926" stroke-width="1.5" />
  
  <!-- Subtle Andes Silhouette on the West -->
  <path d="M20 440 L60 310 L100 370 L150 250 L190 320 L230 180 L280 290 L320 150 L370 260 L400 120" stroke="#2A2421" stroke-width="1.5" fill="none" opacity="0.4" />
  <text x="35" y="40" fill="#5A504B" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" letter-spacing="3">CORDILLERA DE LOS ANDES</text>

  <!-- Arteries & Wine Routes -->
  <!-- Route 40 & Acceso Sur -->
  <path d="M350 40 L350 140 Q350 220 370 280 T390 420" stroke="#3D3530" stroke-width="3" stroke-dasharray="4 4" />
  <!-- Route 7 (East-West) -->
  <path d="M120 140 L580 140" stroke="#3D3530" stroke-width="2.5" stroke-dasharray="4 4" />
  
  <!-- Active Gold Connection Corridors -->
  <path d="M350 140 Q400 170 440 220" stroke="url(#routeGold)" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <path d="M350 140 Q330 200 340 260" stroke="url(#routeGold)" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <path d="M340 260 Q380 280 440 220" stroke="url(#routeGold)" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.6" />
  <path d="M340 260 Q360 360 410 410" stroke="url(#routeGold)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5" />

  <!-- Regions Watermark Labels -->
  <text x="510" y="70" fill="#3D3530" font-family="'Playfair Display', serif" font-size="20" font-style="italic">Territorio Cuyo</text>

  <!-- NODE 1: CIUDAD DE MENDOZA / MERCADO CENTRAL (TORRENT) -->
  <g transform="translate(350, 140)" filter="url(#shadowNode)" class="cursor-pointer">
    <circle cx="0" cy="0" r="24" fill="url(#mapGlow)" />
    <circle cx="0" cy="0" r="10" fill="#6E1624" stroke="#EED798" stroke-width="2.5" />
    <circle cx="0" cy="0" r="3.5" fill="#FFFFFF" />
    <rect x="18" y="-22" width="180" height="44" rx="6" fill="#1C1816" stroke="#C5A059" stroke-width="1" />
    <text x="28" y="-6" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Mendoza Capital</text>
    <text x="28" y="10" fill="#EED798" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600">Torrent • Mercado Central (Loc. 77)</text>
  </g>

  <!-- NODE 2: GODOY CRUZ (TORRENT THE MARKET) -->
  <g transform="translate(330, 200)" filter="url(#shadowNode)">
    <circle cx="0" cy="0" r="18" fill="url(#mapGlow)" />
    <circle cx="0" cy="0" r="8" fill="#6E1624" stroke="#EED798" stroke-width="2" />
    <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
    <rect x="-195" y="-18" width="180" height="38" rx="6" fill="#1C1816" stroke="#C5A059" stroke-width="1" />
    <text x="-185" y="-3" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Godoy Cruz Gourmet</text>
    <text x="-185" y="11" fill="#EED798" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600">Torrent The Market (San Martín Sur)</text>
  </g>

  <!-- NODE 3: LUJÁN DE CUYO / MAYOR DRUMMOND (MARTINO WINES) -->
  <g transform="translate(340, 260)" filter="url(#shadowNode)">
    <circle cx="0" cy="0" r="28" fill="url(#mapGlow)" />
    <circle cx="0" cy="0" r="12" fill="#80182C" stroke="#EED798" stroke-width="3" />
    <circle cx="0" cy="0" r="4" fill="#FFFFFF" />
    <rect x="22" y="-24" width="210" height="48" rx="6" fill="#1C1816" stroke="#EED798" stroke-width="1.2" />
    <text x="32" y="-7" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800">Martino Wines (Mayor Drummond)</text>
    <text x="32" y="8" fill="#EED798" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700">Bodega 1901 • Guía Michelin</text>
    <text x="32" y="19" fill="#A89F93" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="500">Maridaje de Autor & Sunset Sessions</text>
  </g>

  <!-- NODE 4: MAIPÚ (IL MERCATO / FAMILIA RAFFA & BARRANCAS) -->
  <g transform="translate(440, 220)" filter="url(#shadowNode)">
    <circle cx="0" cy="0" r="20" fill="url(#mapGlow)" />
    <circle cx="0" cy="0" r="9" fill="#6E1624" stroke="#EED798" stroke-width="2" />
    <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
    <rect x="20" y="-18" width="190" height="40" rx="6" fill="#1C1816" stroke="#C5A059" stroke-width="1" />
    <text x="30" y="-3" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Maipú • Cuna del Vino</text>
    <text x="30" y="12" fill="#EED798" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600">Familia Raffa (Il Mercato) + Fincas</text>
  </g>

  <!-- NODE 5: VALLE DE UCO (PROYECCIÓN CONCESIONES DE ÉLITE) -->
  <g transform="translate(410, 410)" filter="url(#shadowNode)">
    <circle cx="0" cy="0" r="20" fill="url(#mapGlow)" opacity="0.7" />
    <circle cx="0" cy="0" r="8" fill="#2E2420" stroke="#C5A059" stroke-width="2" stroke-dasharray="3 2" />
    <circle cx="0" cy="0" r="2.5" fill="#C5A059" />
    <rect x="-210" y="-18" width="195" height="38" rx="6" fill="#1C1816" stroke="#8E6922" stroke-width="1" />
    <text x="-200" y="-3" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Valle de Uco (Expansión)</text>
    <text x="-200" y="11" fill="#C5A059" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="600">Hoteles Boutique & Wine Lodges</text>
  </g>

  <!-- Bottom Legend Bar -->
  <g transform="translate(30, 440)">
    <circle cx="10" cy="10" r="5" fill="#6E1624" stroke="#EED798" stroke-width="1.5" />
    <text x="24" y="14" fill="#B2A89C" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Puntos Estratégicos & Alianzas</text>

    <circle cx="210" cy="10" r="5" fill="#1C1816" stroke="#C5A059" stroke-width="1.5" stroke-dasharray="2 2" />
    <text x="224" y="14" fill="#B2A89C" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Red de Concesiones en Expansión</text>

    <line x1="430" y1="10" x2="460" y2="10" stroke="url(#routeGold)" stroke-width="2" />
    <text x="470" y="14" fill="#B2A89C" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Corredor Logístico Mysterik</text>
  </g>
</svg>
