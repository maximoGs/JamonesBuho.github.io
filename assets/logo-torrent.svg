<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 90" fill="none">
  <defs>
    <linearGradient id="goldTorrent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E7D095" />
      <stop offset="50%" stop-color="#C29B48" />
      <stop offset="100%" stop-color="#8E6922" />
    </linearGradient>
  </defs>

  <!-- Traditional Heraldic Icon -->
  <g transform="translate(10, 10)">
    <rect x="5" y="5" width="60" height="60" rx="6" stroke="url(#goldTorrent)" stroke-width="1.8" fill="#171412" />
    <text x="35" y="44" text-anchor="middle" fill="url(#goldTorrent)" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="900">T</text>
    <path d="M15 54 L55 54" stroke="url(#goldTorrent)" stroke-width="1" />
    <text x="35" y="61" text-anchor="middle" fill="#E7D095" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" font-weight="700" letter-spacing="1">1922</text>
  </g>

  <!-- Typography -->
  <g transform="translate(85, 20)">
    <text x="0" y="24" fill="#FFFFFF" font-family="'Playfair Display', Georgia, serif" font-size="25" font-weight="800" letter-spacing="3">TORRENT</text>
    <text x="0" y="40" fill="url(#goldTorrent)" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" letter-spacing="3">DESDE 1922 • MENDOZA</text>
    <text x="0" y="54" fill="#A8A196" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="500" letter-spacing="1.5">FIAMBRES, QUESOS & DELICATESSEN DE ALTA GAMA</text>
  </g>
</svg>
