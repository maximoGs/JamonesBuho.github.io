    <text x="175" y="24" fill="url(#purpleGold)" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="12" font-weight="400" letter-spacing="5">PRODUCCIONES</text>
    <line x1="0" y1="36" x2="260" y2="36" stroke="url(#purpleGold)" stroke-width="0.8" opacity="0.5" />
    <text x="0" y="50" fill="#B0A99E" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="600" letter-spacing="2.2">MARKETING • EXPERIENCIAS • VINCULACIÓN REGIONAL • MENDOZA</text>
