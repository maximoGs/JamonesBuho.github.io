<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" fill="none">
  <defs>
    <linearGradient id="purpleGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C77A" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#A27D30" />
    </linearGradient>
  </defs>

  <!-- Geometric Modern Monogram 'M' -->
  <g transform="translate(10, 8)">
